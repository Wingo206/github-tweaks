<!-- Reviewers incorrectly shares sidebar-assignee; must not be chosen. -->
<div
  class="discussion-sidebar-item sidebar-assignee js-discussion-sidebar-item js-socket-channel js-updatable-content"
  data-url="/acme/widgets/issues/42/show_partial?partial=pull_requests%2Fsidebar%2Fshow%2Freviewers"
  data-channel-event-name="reviewers_updated"
  data-gid="PR_test"
>
  <form
    class="js-issue-sidebar-form"
    aria-label="Select reviewers"
    action="/acme/widgets/pull/42/review-requests"
    method="post"
  >
    <span data-assignee-name="bot-reviewer">bot-reviewer</span>
  </form>
</div>

<div
  class="discussion-sidebar-item sidebar-assignee js-discussion-sidebar-item js-socket-channel js-updatable-content"
  data-url="/acme/widgets/issues/42/show_partial?partial=issues%2Fsidebar%2Fshow%2Fassignees"
  data-channel-event-name="assignees_updated"
  data-gid="PR_test"
>
  <form
    class="js-issue-sidebar-form"
    aria-label="Select assignees"
    action="/acme/widgets/issues/42/assignees"
    method="post"
  >
    <details
      class="details-reset details-overlay select-menu"
      id="assignees-select-menu"
    >
      <summary
        class="text-bold discussion-sidebar-heading discussion-sidebar-toggle"
        aria-haspopup="menu"
        role="button"
      >
        Assignees
      </summary>
      <details-menu class="select-menu-modal" role="menu">
        <div class="select-menu-header">
          <span class="select-menu-title"
            >Assign up to 10 people to this pull request</span
          >
        </div>
      </details-menu>
    </details>

    <span class="css-truncate js-issue-assignees">
      <p>
        <span
          class="d-flex min-width-0"
          data-hovercard-type="user"
          data-assignee-name="reviewer"
        >
          <a class="assignee Link--primary" href="/reviewer">
            <span>reviewer</span>
          </a>
        </span>
      </p>
      <p>
        <span
          class="d-flex min-width-0"
          data-hovercard-type="user"
          data-assignee-name="teammate"
        >
          <a class="assignee Link--primary" href="/teammate">
            <span>teammate</span>
          </a>
        </span>
      </p>
    </span>
  </form>
</div>
