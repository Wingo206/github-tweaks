<div id="pr-file-tree">
  <div id="diff-file-tree-filter">
    <input aria-label="Filter changed files">
  </div>
  <div>
    <h2 class="sr-only">File tree</h2>
    <ul role="tree" aria-label="File Tree">
      <li
        id="src"
        role="treeitem"
        aria-level="1"
        aria-expanded="true"
      >
        <div class="PRIVATE_TreeView-item-container">
          <div class="PRIVATE_TreeView-item-toggle"></div>
          <div class="PRIVATE_TreeView-item-content">
            <span class="PRIVATE_TreeView-item-content-text">
              <span>src</span>
            </span>
          </div>
        </div>
        <ul role="group" aria-label="src">
          <li
            id="src/index.ts"
            role="treeitem"
            aria-level="2"
            aria-label="index.ts"
          >
            <div class="PRIVATE_TreeView-item-container">
              <div class="PRIVATE_TreeView-item-content">
                <span class="PRIVATE_TreeView-item-content-text">
                  <a href="#diff-file-one" role="presentation">index.ts</a>
                </span>
              </div>
            </div>
          </li>
          <li
            id="src/empty.png"
            role="treeitem"
            aria-level="2"
            aria-label="empty.png has 1 comment"
          >
            <div class="PRIVATE_TreeView-item-container">
              <div class="PRIVATE_TreeView-item-content">
                <span class="PRIVATE_TreeView-item-content-text">
                  <a href="#diff-file-two" role="presentation">empty.png</a>
                </span>
                <span aria-label="1 comment">1</span>
              </div>
            </div>
          </li>
        </ul>
      </li>
    </ul>
  </div>
</div>
