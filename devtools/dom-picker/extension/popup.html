<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DOM Dump Picker</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.4 system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-width: 260px;
        padding: 12px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      input[type='number'] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 4px;
      }
      button {
        width: 100%;
        margin-top: 6px;
        padding: 8px 10px;
        cursor: pointer;
      }
      .hint {
        color: #666;
        font-size: 12px;
        margin: 8px 0 0;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .ok {
        color: #0a7;
      }
      .err {
        color: #c33;
      }
    </style>
  </head>
  <body>
    <h1>DOM Dump Picker</h1>
    <label>
      Receiver port
      <input id="port" type="number" min="1" max="65535" value="17373" />
    </label>
    <label>
      <input id="computed" type="checkbox" />
      Include key computed styles
    </label>
    <button id="pick" type="button">Start picking</button>
    <button id="health" type="button">Check receiver</button>
    <p class="hint">
      Hover to highlight · wheel expand/shrink ancestor · click to capture · Esc
      to cancel
    </p>
    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
